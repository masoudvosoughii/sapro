[project]
name = "sapro"
version = "0.4.1b1"
description = "Solve linear programming problems using simplex algorithm."
readme = "README.md"
authors = [
    { name = "origamizyt", email = "zhaoyitong18@163.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
packaging = [
    "pyinstaller>=6.10,<7",
]

[tool.uv.build-backend]
module-root = "src"
source-include = [
    "src/sapro/index.html",
    "src/sapro/static/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "default::RuntimeWarning:sapro.simplex",
]

[project.urls]
source = "https://github.com/origamizyt/sapro"

[project.scripts]
sapro = "sapro.__main__:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
